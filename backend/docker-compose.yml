version: "3.9"

services:
  db:
    image: postgres:15
    container_name: countries_db
    restart: always
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD: cappac
      POSTGRES_DB: countries_db
    ports:
      - "5433:5432"   
      - postgres_data:/var/lib/postgresql/data


  web:
    build: .
    container_name: fastapi_app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://cap:cappac@db:5432/countries_db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
